  <!-- 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b-2 border-pink-100">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-pink-300 via-purple-300 to-indigo-300 flex items-center justify-center text-white shadow-sm shadow-pink-200 text-lg">

        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-xl font-cute-title tracking-wide text-pink-600">스쿨체크</h1>
            <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-600 border border-purple-200">고1 다이어리 ✨</span>
          </div>
          <p class="text-xs text-slate-400 hidden sm:block">오늘도 놓치는 수행평가 없이 꼼꼼하게 챙겨요!</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="downloadHtmlFile()" title="HTML 파일로 내 기기에 저장" class="flex items-center gap-1.5 bg-purple-50 hover:bg-purple-100 text-purple-600 text-xs font-bold px-3 py-2.5 rounded-2xl border border-purple-200 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="download" aria-hidden="true" class="lucide lucide-download w-4 h-4"><path d="M12 15V3"></path><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path></svg>

        <button onclick="resetToSampleData()" title="샘플 데이터 초기화" class="p-2.5 text-pink-400 hover:text-pink-600 hover:bg-pink-50 rounded-2xl transition-colors">

  <!-- 메인 콘텐츠 컨테이너 -->

    <!-- 1. 대시보드 요약 & 긴급 마감 알림 배너 -->

        // 현재 사용자의 최신 데이터를 기본 데이터로 주입
        const currentDataJson = JSON.stringify(assessments);
        const scripts = clonedDoc.querySelectorAll('script');
        scripts.forEach(s => {
          if (s.textContent.includes('let assessments = [];')) {
            s.textContent = s.textContent.replace(
              'let assessments = [];',
              `let assessments = ${currentDataJson};`
            ).replace(
              'assessments = createSampleData();',
              `assessments = ${currentDataJson};`
            );
          }
        });

        const htmlContent = '<!DOCTYPE html>\n' + clonedDoc.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.href = url;
        link.download = '스쿨체크_고1수행평가플래너.html';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        showToast('HTML 파일 다운로드가 시작되었어요! 📥');
      } catch (error) {
        console.error('HTML 다운로드 오류:', error);
        showToast('파일 저장 중 오류가 발생했어요.');
      }
    }

    // =========================================================================
    // 2. 핵심 비즈니스 로직 (D-Day 계산 및 유틸리티)
    // =========================================================================
    function calculateDDay(dueDateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      const [year, month, day] = dueDateStr.split('-').map(Number);
      const due = new Date(year, month - 1, day);
      due.setHours(0, 0, 0, 0);

      const diffTime = due - today;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      return diffDays;
    }

    function getDDayBadge(diffDays, isCompleted) {
      if (isCompleted) {
        return {
          label: '제출완료 🍀',
          classes: 'bg-emerald-100 text-emerald-700 border-emerald-200'
        };
      }
      if (diffDays < 0) {
        return {
          label: `마감 지남 (D+${Math.abs(diffDays)})`,
          classes: 'bg-slate-100 text-slate-500 border-slate-200'
        };
      }
      if (diffDays === 0) {
        return {
          label: '오늘 마감! 🔥',
          classes: 'bg-rose-400 text-white border-rose-400 animate-pulse'
        };
      }
      if (diffDays <= 3) {
        return {
          label: `D-${diffDays} 🚨`,
          classes: 'bg-rose-100 text-rose-600 border-rose-200 font-extrabold'
        };
      }
      if (diffDays <= 7) {
        return {
          label: `D-${diffDays} ✨`,
          classes: 'bg-amber-100 text-amber-700 border-amber-200'
        };
      }
      return {
        label: `D-${diffDays} ☁️`,
        classes: 'bg-purple-100 text-purple-600 border-purple-200'
      };
    }

    function getImportanceBadge(imp) {
      if (imp === 'high') return '<span class="text-[11px] font-bold text-pink-600 bg-pink-50 border border-pink-100 px-2.5 py-0.5 rounded-full">💖 중요도 상</span>';
      if (imp === 'medium') return '<span class="text-[11px] font-bold text-amber-600 bg-amber-50 border border-amber-100 px-2.5 py-0.5 rounded-full">💛 중요도 중</span>';
      return '<span class="text-[11px] font-bold text-emerald-600 bg-emerald-50 border border-emerald-100 px-2.5 py-0.5 rounded-full">💚 중요도 하</span>';
    }

    // 토스트 알림 메시지
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'bg-purple-900/90 backdrop-blur-xs text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg mb-2 animate-fade-in flex items-center gap-2';
      toast.innerHTML = `<span>🌸</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 2400);
    }

    // =========================================================================
    // 3. UI 렌더링 함수
    // =========================================================================
    function renderApp() {
      renderUrgentBanner();
      renderStats();
      renderSubjectFilters();
      renderAssessmentList();
      lucide.createIcons();
    }

    // 상단 긴급 마감 알림 배너 (D-3 이내 미완료 항목)
    function renderUrgentBanner() {
      const urgentSection = document.getElementById('urgent-section');
      const urgentItems = assessments
        .filter(item => !item.completed)
        .map(item => ({ ...item, dday: calculateDDay(item.dueDate) }))
        .filter(item => item.dday >= 0 && item.dday <= 3)
        .sort((a, b) => a.dday - b.dday);

      if (urgentItems.length === 0) {
        urgentSection.innerHTML = `
          <div class="bg-gradient-to-r from-purple-200 via-pink-200 to-amber-100 rounded-3xl p-4 text-purple-900 shadow-xs border-2 border-white flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-2xl bg-white/80 flex items-center justify-center shrink-0 text-xl shadow-xs">
                🧸
              </div>
              <div>
                <h2 class="text-sm font-bold text-purple-900">3일 이내 마감되는 급한 수행평가가 없어요!</h2>
                <p class="text-xs text-purple-700/80 mt-0.5">미리미리 체크리스트를 채워 여유롭게 준비해 볼까요? ✨</p>
              </div>
            </div>
          </div>
        `;
        return;
      }

      const itemsHtml = urgentItems.map(item => {
        const dText = item.dday === 0 ? '오늘 마감!' : `D-${item.dday}`;
        const subStyle = SUBJECT_STYLES[item.subject] || SUBJECT_STYLES['기타'];
        return `
          <div class="flex items-center justify-between bg-white/95 text-slate-800 px-3.5 py-2.5 rounded-2xl shadow-xs">
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-xs font-extrabold text-rose-500 bg-rose-100 px-2.5 py-0.5 rounded-full shrink-0">${dText}</span>
              <span class="text-xs font-bold text-purple-700 shrink-0">${subStyle.emoji} ${item.subject}</span>
              <span class="text-xs font-bold truncate">${item.title}</span>
            </div>
            <button onclick="toggleComplete('${item.id}')" class="text-[11px] font-bold text-pink-500 hover:text-pink-600 bg-pink-50 px-2.5 py-1 rounded-full shrink-0 ml-2 transition-colors">
              완료체크 🍀
            </button>
          </div>
        `;
      }).join('');

      urgentSection.innerHTML = `
        <div class="bg-gradient-to-r from-rose-200 via-pink-200 to-orange-200 rounded-3xl p-4 text-rose-950 shadow-sm border-2 border-white space-y-2.5">
          <div class="flex items-center gap-2">
            <span class="text-base animate-bounce">🍓</span>
            <h2 class="text-sm font-bold text-rose-900">긴급 마감 알림! 곧 제출해야 할 수행평가가 ${urgentItems.length}건 있어요</h2>
          </div>
          <div class="space-y-1.5">
            ${itemsHtml}
          </div>
        </div>
      `;
    }

    // 요약 통계 업데이트
    function renderStats() {
      const active = assessments.filter(a => !a.completed).length;
      const urgent = assessments.filter(a => {
        if (a.completed) return false;
        const d = calculateDDay(a.dueDate);
        return d >= 0 && d <= 3;
      }).length;
      const completed = assessments.filter(a => a.completed).length;

      document.getElementById('stat-active').textContent = active;
      document.getElementById('stat-urgent').textContent = urgent;
      document.getElementById('stat-completed').textContent = completed;
    }

    // 과목별 필터 버튼 렌더링
    function renderSubjectFilters() {
      const container = document.getElementById('subject-filters');
      const subjects = ['전체', ...new Set(assessments.map(a => a.subject))];

      container.innerHTML = subjects.map(sub => {
        const isSelected = selectedSubjectFilter === sub;
        const count = sub === '전체' 
          ? assessments.length 
          : assessments.filter(a => a.subject === sub).length;
        const emoji = sub === '전체' ? '🌈' : (SUBJECT_STYLES[sub]?.emoji || '📚');

        const btnClass = isSelected
          ? 'bg-pink-400 text-white border-pink-400 shadow-xs shadow-pink-200'
          : 'bg-white text-slate-600 border-pink-100 hover:bg-pink-50';

        return `
          <button onclick="setSubjectFilter('${sub}')" class="px-3.5 py-1.5 rounded-full text-xs font-bold border-2 transition-all shrink-0 flex items-center gap-1.5 ${btnClass}">
            <span>${emoji} ${sub}</span>
            <span class="text-[10px] opacity-85">(${count})</span>
          </button>
        `;
      }).join('');
    }

    function setSubjectFilter(subject) {
      selectedSubjectFilter = subject;
      renderApp();
    }

    // 메인 수행평가 카드 리스트 렌더링
    function renderAssessmentList() {
      const listContainer = document.getElementById('assessment-list');
      const sortBy = document.getElementById('sort-select').value;
      const hideCompleted = document.getElementById('hide-completed').checked;

      // 1) 필터링
      let filtered = assessments.filter(item => {
        if (hideCompleted && item.completed) return false;
        if (selectedSubjectFilter !== '전체' && item.subject !== selectedSubjectFilter) return false;
        return true;
      });

      // 2) 정렬
      const impWeight = { high: 3, medium: 2, low: 1 };
      filtered.sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;

        if (sortBy === 'dday') {
          return calculateDDay(a.dueDate) - calculateDDay(b.dueDate);
        }
        if (sortBy === 'importance') {
          return impWeight[b.importance] - impWeight[a.importance];
        }
        return b.createdAt - a.createdAt;
      });

      // 빈 화면 처리
      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="bg-white/90 rounded-3xl border-2 border-dashed border-pink-200 p-12 text-center space-y-3">
            <div class="w-14 h-14 rounded-3xl bg-pink-50 text-2xl mx-auto flex items-center justify-center">
              🐰
            </div>
            <h3 class="text-sm font-bold text-slate-700">표시할 수행평가 일정이 없어요</h3>
            <p class="text-xs text-slate-400">우측 상단의 '수행 추가' 버튼을 눌러 새 일정을 등록해 보세요!</p>
          </div>
        `;
        return;
      }

      // 카드 HTML 생성
      listContainer.innerHTML = filtered.map(item => {
        const dday = calculateDDay(item.dueDate);
        const badge = getDDayBadge(dday, item.completed);
        const subStyle = SUBJECT_STYLES[item.subject] || SUBJECT_STYLES['기타'];

        // 체크리스트 진행률 계산
        const totalTodos = item.todos.length;
        const doneTodos = item.todos.filter(t => t.done).length;
        const progressPercent = totalTodos === 0 ? 0 : Math.round((doneTodos / totalTodos) * 100);

        // 체크리스트 항목 HTML
        const todosHtml = item.todos.map(todo => `
          <div class="flex items-center justify-between group py-1.5">
            <label class="flex items-center gap-2.5 cursor-pointer flex-1 min-w-0">
              <input type="checkbox" ${todo.done ? 'checked' : ''} onchange="toggleTodo('${item.id}', '${todo.id}')" class="w-4 h-4 rounded-md accent-pink-400 border-pink-200 cursor-pointer" />
              <span class="text-xs ${todo.done ? 'line-through text-slate-400' : 'text-slate-700 font-bold'} truncate">${todo.text}</span>
            </label>
            <button onclick="deleteTodo('${item.id}', '${todo.id}')" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-500 p-1 transition-opacity" title="할 일 삭제">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `).join('');

        return `
          <article class="bg-white/95 rounded-3xl border-2 ${item.completed ? 'border-slate-100 opacity-75' : 'border-pink-100/90'} shadow-sm hover:shadow-md hover:shadow-pink-100/50 transition-all p-5 space-y-4 animate-fade-in">
            <!-- 카드 상단: 과목 태그, 유형, D-Day 배지 -->
            <div class="flex items-start justify-between gap-2">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-xs font-bold px-3 py-1 rounded-full border ${subStyle.bg} ${subStyle.text} ${subStyle.border}">
                  ${subStyle.emoji} ${item.subject}
                </span>
                <span class="text-xs font-bold text-slate-500 bg-slate-100/80 px-2.5 py-1 rounded-full">
                  ${item.type}
                </span>
                ${getImportanceBadge(item.importance)}
              </div>

              <span class="text-xs font-bold px-3 py-1 rounded-full border shrink-0 ${badge.classes}">
                ${badge.label}
              </span>
            </div>

            <!-- 제목 및 마감 날짜 -->
            <div>
              <h3 class="text-base font-bold ${item.completed ? 'line-through text-slate-400' : 'text-slate-800'}">
                ${item.title}
              </h3>
              <div class="flex items-center gap-1.5 text-xs text-slate-500 mt-1">
                <span>🗓️</span>
                <span>마감일: <strong class="text-purple-700">${item.dueDate}</strong></span>
              </div>
            </div>

            <!-- 평가 기준 / 루브릭 메모 -->
            ${item.memo ? `
              <div class="bg-amber-50/70 rounded-2xl p-3 border border-amber-100 text-xs text-amber-900 flex items-start gap-2">
                <span class="shrink-0">💡</span>
                <p class="leading-relaxed">${item.memo}</p>
              </div>
            ` : ''}

            <!-- 단계별 준비 체크리스트 영역 -->
            <div class="bg-purple-50/50 rounded-2xl p-3.5 border border-purple-100/80 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-purple-800 flex items-center gap-1.5">
                  <span>📝</span>
                  단계별 준비 체크리스트
                </span>
                <span class="text-[11px] font-extrabold text-pink-500">${doneTodos}/${totalTodos} (${progressPercent}%)</span>
              </div>

              <!-- 진행률 프로그레스 바 -->
              <div class="w-full h-2 bg-white rounded-full overflow-hidden border border-purple-100">
                <div class="h-full bg-gradient-to-r from-pink-400 to-purple-400 transition-all duration-300 rounded-full" style="width: ${progressPercent}%"></div>
              </div>

              <!-- 할 일 목록 -->
              <div class="divide-y divide-purple-100/50">
                ${todosHtml}
              </div>

              <!-- 새 할 일 빠른 추가 입력창 -->
              <form onsubmit="addTodo(event, '${item.id}')" class="flex items-center gap-1.5 pt-1">
                <input type="text" id="new-todo-${item.id}" placeholder="세부 할 일 추가 (예: 자료 조사, PPT 제작)" class="flex-1 bg-white border border-purple-100 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:border-pink-300" />
                <button type="submit" class="bg-purple-400 hover:bg-purple-500 text-white text-xs font-bold px-3.5 py-1.5 rounded-xl transition-colors shrink-0">
                  추가
                </button>
              </form>
            </div>

            <!-- 카드 하단 액션 버튼 -->
            <div class="pt-1 flex items-center justify-between border-t border-pink-50">
              <button onclick="toggleComplete('${item.id}')" class="flex items-center gap-1.5 text-xs font-bold px-3.5 py-1.5 rounded-full transition-colors ${item.completed ? 'bg-slate-100 text-slate-600 hover:bg-slate-200' : 'bg-emerald-100/80 text-emerald-700 hover:bg-emerald-200/70'}">
                <span>${item.completed ? '↩️' : '🍀'}</span>
                <span>${item.completed ? '진행 중으로 되돌리기' : '제출 완료 표시'}</span>
              </button>

              <div class="flex items-center gap-1">
                <button onclick="openModal('${item.id}')" class="p-2 text-slate-400 hover:text-purple-600 hover:bg-purple-50 rounded-xl transition-colors" title="수정">
                  <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
                <button onclick="deleteAssessment('${item.id}')" class="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-colors" title="삭제">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    // =========================================================================
    // 4. 사용자 인터랙션 핸들러 (CRUD 및 체크리스트)
    // =========================================================================
    function openModal(editId = null) {
      const modal = document.getElementById('assessment-modal');
      const form = document.getElementById('assessment-form');
      const titleEl = document.getElementById('modal-title');
      const initialTodoGroup = document.getElementById('initial-checklist-group');

      form.reset();
      document.getElementById('edit-id').value = '';

      if (editId) {
        const target = assessments.find(a => a.id === editId);
        if (!target) return;
        titleEl.innerHTML = '<span>✏️</span> 수행평가 일정 수정';
        document.getElementById('edit-id').value = target.id;
        document.getElementById('input-subject').value = target.subject;
        document.getElementById('input-type').value = target.type;
        document.getElementById('input-title').value = target.title;
        document.getElementById('input-dueDate').value = target.dueDate;
        document.getElementById('input-importance').value = target.importance;
        document.getElementById('input-memo').value = target.memo || '';
        initialTodoGroup.classList.add('hidden');
      } else {
        titleEl.innerHTML = '<span>✨</span> 새 수행평가 등록';
        document.getElementById('input-dueDate').value = getOffsetDateStr(7);
        initialTodoGroup.classList.remove('hidden');
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('assessment-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('edit-id').value;
      const subject = document.getElementById('input-subject').value;
      const type = document.getElementById('input-type').value;
      const title = document.getElementById('input-title').value.trim();
      const dueDate = document.getElementById('input-dueDate').value;
      const importance = document.getElementById('input-importance').value;
      const memo = document.getElementById('input-memo').value.trim();

      if (editId) {
        // 기존 항목 수정
        const idx = assessments.findIndex(a => a.id === editId);
        if (idx !== -1) {
          assessments[idx] = {
            ...assessments[idx],
            subject,
            type,
            title,
            dueDate,
            importance,
            memo
          };
          showToast('수행평가 정보가 수정되었습니다.');
        }
      } else {
        // 새 항목 등록
        const rawTodos = document.getElementById('input-todos').value;
        const parsedTodos = rawTodos
          .split(',')
          .map(s => s.trim())
          .filter(Boolean)
          .map((text, index) => ({
            id: `todo-${Date.now()}-${index}`,
            text,
            done: false
          }));

        // 입력된 체크리스트가 없으면 기본 2단계 자동 생성
        const defaultTodos = parsedTodos.length > 0 ? parsedTodos : [
          { id: `todo-${Date.now()}-1`, text: '평가 기준 확인 및 자료 준비', done: false },
          { id: `todo-${Date.now()}-2`, text: '최종 점검 및 제출 완료', done: false }
        ];

        const newItem = {
          id: `item-${Date.now()}`,
          subject,
          type,
          title,
          dueDate,
          importance,
          memo,
          completed: false,
          createdAt: Date.now(),
          todos: defaultTodos
        };
        assessments.unshift(newItem);
        showToast('새 수행평가가 등록되었습니다!');
      }

      saveData();
      closeModal();
      renderApp();
    }

    function toggleComplete(id) {
      const item = assessments.find(a => a.id === id);
      if (!item) return;
      item.completed = !item.completed;
      saveData();
      renderApp();
      showToast(item.completed ? '수행평가 제출을 완료했습니다! 수고했어요 🎉' : '진행 중 상태로 변경되었습니다.');
    }

    function deleteAssessment(id) {
      assessments = assessments.filter(a => a.id !== id);
      saveData();
      renderApp();
      showToast('수행평가 일정이 삭제되었습니다.');
    }

    // 체크리스트 항목 토글
    function toggleTodo(assessmentId, todoId) {
      const item = assessments.find(a => a.id === assessmentId);
      if (!item) return;
      const todo = item.todos.find(t => t.id === todoId);
      if (todo) {
        todo.done = !todo.done;
        saveData();
        renderApp();
      }
    }

    // 체크리스트 새 항목 추가
    function addTodo(e, assessmentId) {
      e.preventDefault();
      const input = document.getElementById(`new-todo-${assessmentId}`);
      const text = input.value.trim();
      if (!text) return;

      const item = assessments.find(a => a.id === assessmentId);
      if (!item) return;

      item.todos.push({
        id: `todo-${Date.now()}`,
        text,
        done: false
      });

      input.value = '';
      saveData();
      renderApp();
    }

    // 체크리스트 항목 삭제
    function deleteTodo(assessmentId, todoId) {
      const item = assessments.find(a => a.id === assessmentId);
      if (!item) return;
      item.todos = item.todos.filter(t => t.id !== todoId);
      saveData();
      renderApp();
    }

    // =========================================================================
    // 5. 앱 초기화 실행
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      renderApp();
    });
  </script>
